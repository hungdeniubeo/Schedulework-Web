[functions.admin-users]
# The platform validates the Auth JWT first. The handler separately authorizes
# admin account management and active-employee password changes.
verify_jwt = true

[functions.username-login]
# Username login is the public entry point that exchanges a username/password
# for a normal Supabase Auth session. The handler performs its own validation.
verify_jwt = false

[functions.bootstrap-admin]
# The first Admin has no session yet. The handler is public only until an Admin
# profile exists, then it permanently rejects further bootstrap attempts.
verify_jwt = false
