name: Port scheduler CI

on:
  push:
    branches:
      - feat/port-schedulework-scheduler
      - feat/username-auth

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scheduler focused tests
        run: >-
          npm test --
          src/app/router.test.ts
          src/lib/pageRefresh.test.ts
          src/lib/serverApi.test.ts
          src/components/AuthLoginPage.test.tsx
          src/auth/UsernameAuthMigration.test.ts
          src/admin/api.test.ts
          src/admin/UnifiedWeekWorkflowMigration.test.ts
          src/admin/GroupLifecycleMigration.test.ts
          src/admin/GroupDeleteRpcMigration.test.ts
          src/admin/DeleteWeekDiagnostics.test.ts
          src/admin/WeeklyFlowRegression.test.tsx
          src/admin/adminWeekSelection.test.ts
          src/admin/registrationWeekUi.test.ts
          src/admin/WeekDialogs.test.tsx
          src/admin/GroupDeleteDialog.test.tsx
          src/admin/GroupManager.test.ts
          src/admin/EmployeeManager.test.tsx
          src/admin/employeePositions.test.ts
          src/admin/AdminNavigation.test.tsx
          src/admin/AdminAvailabilityPage.test.tsx
          src/admin/AdminMatrix.test.tsx
          src/admin/AdminSchedulePage.test.tsx
          src/admin/AdminDashboard.test.tsx
          src/admin/AdminSelects.test.tsx
          src/admin/AdminSchedulerBehavior.test.tsx
          src/admin/SchedulerTable.test.tsx
          src/admin/ScheduleDailySummary.test.tsx
          src/admin/AdminScheduleExport.test.tsx
          src/admin/ScheduleGrid.test.tsx
          src/admin/ScheduleGridLayout.test.tsx
          src/admin/schedulerDnd.test.ts
          src/employee/EmployeeRegistrationPage.test.ts
          src/employee/employeePortalRefresh.test.ts
          src/employee/ScheduleViews.test.tsx
          src/employee/registrationWeekSelection.test.ts
          src/employee/scheduleApi.test.ts
          src/scheduling/groupDeleteApi.test.ts
          src/scheduling/exportJpg.test.ts
          src/scheduling/availabilityShiftMatch.test.ts
          src/scheduling/employeeOrder.test.ts
          src/scheduling/reorderApi.test.ts
          src/scheduling/availabilityNotice.test.ts
          src/scheduling/scheduleSheetModel.test.ts
          src/scheduling/ScheduleSheet.test.tsx
          src/scheduling/overlap.test.ts
          src/scheduling/merge.test.ts
          src/scheduling/staffing.test.ts
          src/scheduling/publication.test.ts
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Deno shared tests
        run: npx --yes deno@latest test --config supabase/functions/deno.json supabase/functions/_shared/*_test.ts
      - name: Deno username-login tests
        run: npx --yes deno@latest test --config supabase/functions/deno.json supabase/functions/username-login/logic_test.ts
      - name: Deno admin-users typecheck
        run: npx --yes deno@latest check --config supabase/functions/deno.json supabase/functions/admin-users/index.ts
      - name: Deno username-login typecheck
        run: npx --yes deno@latest check --config supabase/functions/deno.json supabase/functions/username-login/index.ts
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
